<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- history: cards peeking out behind the board -->
  <rect x="30" y="14" width="76" height="98" rx="12" fill="#99c1f1" transform="rotate(8 68 63)" opacity="0.55"/>
  <rect x="26" y="14" width="76" height="98" rx="12" fill="#78aeed" transform="rotate(4 64 63)" opacity="0.8"/>
  <!-- board -->
  <rect x="20" y="16" width="76" height="98" rx="12" fill="url(#board)" filter="url(#shadow)"/>
  <!-- paper -->
  <rect x="28" y="30" width="60" height="76" rx="6" fill="#fff"/>
  <rect x="35" y="46" width="46" height="6" rx="3" fill="#a5c8f3"/>
  <rect x="35" y="59" width="46" height="6" rx="3" fill="#a5c8f3"/>
  <rect x="35" y="72" width="30" height="6" rx="3" fill="#a5c8f3"/>
  <!-- clip -->
  <rect x="40" y="8" width="36" height="24" rx="8" fill="url(#clip)"/>
  <rect x="50" y="14" width="16" height="8" rx="4" fill="#5e5c64"/>
  <!-- pin badge -->
  <circle cx="94" cy="94" r="22" fill="url(#badge)" filter="url(#shadow)"/>
  <path d="M94 82 l3.5 7.5 8 1 -5.9 5.6 1.5 8 -7.1-4 -7.1 4 1.5-8 -5.9-5.6 8-1z" fill="#fff"/>
</svg>
