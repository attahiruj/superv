name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Format, lint and test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p superv-core --all-targets -- -D warnings
      - run: cargo test -p superv-core --locked

  app:
    name: Build app (Arch, GTK4 + layer-shell)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git rust gtk4 gtk4-layer-shell pkgconf
      - uses: actions/checkout@v4
      - run: cargo build --workspace --locked
